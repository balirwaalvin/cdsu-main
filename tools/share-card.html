<!DOCTYPE html>
<!-- Template for the 1200×630 link-preview images. Rendered by tools/share_preview.py with headless Chrome.
     Query parameters: kicker, title, accent, sub, img, fit (photo | float). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital@1&family=Plus+Jakarta+Sans:wght@700;800&display=block" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: Inter, sans-serif; color: #fff; position: relative;
      background: radial-gradient(ellipse at 88% 30%, rgba(52,98,168,.75) 0%, transparent 60%),
                  linear-gradient(120deg, #0A1A42 0%, #0B1F54 55%, #143A7A 100%);
    }
    body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #E9B30C; }
    .ring { position: absolute; right: -140px; top: -140px; width: 520px; height: 520px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 0 0 70px rgba(255,255,255,.02); }
    .copy { position: absolute; left: 70px; top: 64px; width: 640px; height: 500px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand .logo { width: 74px; height: 74px; background: #fff; border-radius: 14px; display: grid; place-items: center; }
    .brand .logo img { width: 60px; height: 60px; object-fit: contain; }
    .brand .bar { width: 5px; height: 58px; border-radius: 9px; background: #E9B30C; }
    .brand small { display: block; font: 700 15px "Plus Jakarta Sans"; letter-spacing: .14em; color: #E9B30C; }
    .brand strong { display: block; font: 800 25px "Plus Jakarta Sans"; letter-spacing: -.01em; }
    .kicker { margin-top: 46px; align-self: flex-start; font: 700 15px "Plus Jakarta Sans"; letter-spacing: .12em; text-transform: uppercase; padding: 9px 18px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); }
    h1 { margin-top: 22px; font: 800 64px/1.05 "Plus Jakarta Sans"; letter-spacing: -.02em; }
    h1 .accent { display: block; color: #E9B30C; }
    .sub { margin-top: 20px; font-size: 24px; line-height: 1.4; color: rgba(255,255,255,.88); }
    .foot { margin-top: auto; display: flex; align-items: center; gap: 16px; font-size: 18px; color: rgba(255,255,255,.75); }
    .foot em { font: italic 20px Merriweather; color: #fff; }
    .foot span { width: 6px; height: 6px; border-radius: 50%; background: #E9B30C; }
    .visual { position: absolute; right: 64px; top: 64px; bottom: 72px; width: 400px; display: grid; place-items: center; }
    .visual.photo img { width: 400px; height: 494px; object-fit: cover; object-position: top center; border-radius: 22px; border: 4px solid #E9B30C; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
    .visual.float img { max-width: 380px; max-height: 500px; filter: drop-shadow(0 34px 44px rgba(0,0,0,.55)); }
    .visual.emblem { background: #fff; border-radius: 28px; width: 360px; height: 360px; top: 135px; bottom: auto; right: 84px; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
    .visual.emblem img { width: 250px; height: 250px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="copy">
    <div class="brand">
      <span class="logo"><img src="../assets/images/cdsu_emblem.png" alt=""></span>
      <span class="bar"></span>
      <span><small>THE CAREER DEVELOPMENT</small><strong>SOCIETY OF UGANDA</strong></span>
    </div>
    <div class="kicker" id="kicker"></div>
    <h1><span id="title"></span><span class="accent" id="accent"></span></h1>
    <p class="sub" id="sub"></p>
    <div class="foot"><em>Building people first, for wealth to follow.</em></div>
  </div>
  <div class="visual" id="visual"><img id="img" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const k of ["kicker", "title", "accent", "sub"]) document.getElementById(k).textContent = q.get(k) || "";
    document.getElementById("img").src = "../assets/images/" + (q.get("img") || "cdsu_emblem.png");
    document.getElementById("visual").classList.add(q.get("fit") || "photo");
  </script>
</body>
</html>
