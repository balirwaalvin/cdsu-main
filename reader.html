<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader — Career Development: A Path to Wealth</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/images/cdsu_emblem.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261105a" />
  <link rel="stylesheet" href="css/reader.css?v=20261105a" />
</head>
<body class="reader-body">
  <header class="reader-bar">
    <a href="account.html" class="reader-back" aria-label="Back to My Account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <img src="assets/images/cdsu_emblem.png" alt="" />
    </a>
    <div class="reader-title">
      <small>CDSU Online Edition</small>
      <strong id="book-title">Career Development: A Path to Wealth</strong>
    </div>
    <div class="reader-controls" id="reader-controls">
      <button type="button" class="reader-btn" id="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <form id="page-form" class="reader-page">
        <label class="sr-only" for="page-input">Page</label>
        <input id="page-input" type="number" min="1" value="1" inputmode="numeric" />
        <span>of <span id="page-total">–</span></span>
      </form>
      <button type="button" class="reader-btn" id="next" aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button type="button" class="reader-btn reader-fit" id="fit">Fit page</button>
    </div>
    <div class="reader-progress" id="reader-progress"><span></span></div>
  </header>

  <main class="reader-stage" id="reader-stage">
    <canvas id="page-canvas" aria-label="Book page"></canvas>
    <p class="reader-status" id="reader-status" role="status">Opening your book…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supa.js?v=20261105a"></script>
  <script src="js/reader.js?v=20261105a"></script>
</body>
</html>
